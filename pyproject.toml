[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel2report"
version = "0.1.0"
description = "Turn screen recordings of app usage into timestamped, AI-annotated step-by-step reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reel2report = "reel2report.cli:main"

[tool.setuptools]
packages = ["reel2report"]
